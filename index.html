
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CG</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.7;
            background: #f5f5f5;
            color: #222;
        }
        h1 {
            text-align: center;
        }
        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>CG</h1>
    <pre id="content">Loading...</pre>

    <script>
        fetch('./Computer_Graphics_Practicals_Pages_1_to_22.txt')
            .then(response => {
                if (!response.ok) throw new Error("File not found");
                return response.text();
            })
            .then(text => {
                document.getElementById('content').textContent = text;
            })
            .catch(() => {
                document.getElementById('content').textContent =
                    'Could not load the TXT file. Check its filename.';
            });
    </script>
</body>
</html>
